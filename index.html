<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Kanji Writer</title>
  <script src="https://unpkg.com/hanzi-writer@2.2.2/dist/hanziwriter.min.js"></script>
</head>
<body>

  <h2>Kanji: 電</h2>
  <div id="draw" style="width:300px;height:300px;"></div>

  <script>
    window.onload = function () {
      const writer = HanziWriter.create('draw', '電', {
        width: 300,
        height: 300,
        showOutline: true,
        showCharacter: false
      });
      writer.animateCharacter();
    };
  </script>

</body>
</html>
